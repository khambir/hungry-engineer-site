<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hungry Engineer</title>
<style>
  :root {
    --bg: #faf9f6;
    --fg: #14161a;
    --muted: #5b6270;
    --accent: #d94f30;
    --border: #e7e4dd;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --fg: #f4f2ee;
      --muted: #9aa0ab;
      --accent: #ff6b45;
      --border: #262a31;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main {
    max-width: 560px;
    text-align: center;
  }
  .eyebrow {
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 18px;
  }
  h1 {
    font-size: clamp(40px, 8vw, 64px);
    line-height: 1.05;
    margin: 0 0 18px;
    letter-spacing: -0.02em;
  }
  h1 span {
    color: var(--accent);
  }
  p.tagline {
    font-size: 19px;
    line-height: 1.5;
    color: var(--muted);
    margin: 0 0 36px;
  }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 8px 16px;
    margin-bottom: 40px;
  }
  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
  }
  a.cta {
    display: inline-block;
    background: var(--fg);
    color: var(--bg);
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    padding: 13px 26px;
    border-radius: 8px;
    transition: opacity 0.15s ease;
  }
  a.cta:hover { opacity: 0.85; }
  footer {
    margin-top: 56px;
    font-size: 13px;
    color: var(--muted);
  }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <div class="eyebrow">A book for engineers</div>
  <h1>Hungry <span>Engineer</span></h1>
  <p class="tagline">Currently in research &amp; writing. Leave your email and I'll let you know the moment it's ready.</p>
  <div class="status"><span class="dot"></span> Coming soon</div>
  <div>
    <a class="cta" href="mailto:hello@hungryeng.com?subject=Notify%20me%20about%20Hungry%20Engineer">Get notified</a>
  </div>
  <footer>&copy; 2026 Hungry Engineer &middot; by Vlad</footer>
</main>
</body>
</html>
